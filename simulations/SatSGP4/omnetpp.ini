[Config AdaptiveVideoV2]
extends = Experiment1
description = "Adaptive segmented TCP video client with buffer and stalls"

sim-time-limit = 30s

SatSGP4.groundStation[0].numApps = 2
SatSGP4.groundStation[1].numApps = 1

# Adaptive video client
SatSGP4.groundStation[0].app[0].typename = "leosatellites.adaptivevideo.AdaptiveVideoClientApp"
SatSGP4.groundStation[0].app[0].connectAddress = "SatSGP4.groundStation[1]"
SatSGP4.groundStation[0].app[0].connectPort = 1000
SatSGP4.groundStation[0].app[0].localPort = -1
SatSGP4.groundStation[0].app[0].startTime = 1s
SatSGP4.groundStation[0].app[0].stopTime = 29s

# 30 second video, 15 segments, 2 seconds each
SatSGP4.groundStation[0].app[0].numSegmentsPerSession = 15
SatSGP4.groundStation[0].app[0].segmentDuration = 2s
SatSGP4.groundStation[0].app[0].requestLength = 200B

# Start at 3 Mbps, then adapt from measured segment throughput
SatSGP4.groundStation[0].app[0].segmentBitrate = 3Mbps
SatSGP4.groundStation[0].app[0].adaptBitrate = true
SatSGP4.groundStation[0].app[0].minSegmentBitrate = 300kbps
SatSGP4.groundStation[0].app[0].maxSegmentBitrate = 5Mbps
SatSGP4.groundStation[0].app[0].adaptationSafetyFactor = 0.85

# Playback buffer model
SatSGP4.groundStation[0].app[0].enablePlaybackBuffer = true
SatSGP4.groundStation[0].app[0].startupBufferTarget = 4s

SatSGP4.groundStation[0].app[0].interSegmentDelay = 0s
SatSGP4.groundStation[0].app[0].idleInterval = 1000s
SatSGP4.groundStation[0].app[0].reconnectInterval = 30s

# Generic TCP server
SatSGP4.groundStation[1].app[0].typename = "TcpGenericServerApp"
SatSGP4.groundStation[1].app[0].localPort = 1000
SatSGP4.groundStation[1].app[0].replyDelay = 0s

# RTT probe
SatSGP4.groundStation[0].app[1].typename = "PingApp"
SatSGP4.groundStation[0].app[1].destAddr = "SatSGP4.groundStation[1]"
SatSGP4.groundStation[0].app[1].startTime = 1s
SatSGP4.groundStation[0].app[1].sendInterval = 50ms

