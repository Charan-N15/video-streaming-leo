[Config VideoUDP]
extends = Experiment1
description = "UDP video stream between London and New York, no RTT modification"

sim-time-limit = 30s

# Override inherited PingApp setup using full module paths
# SatSGP4.groundStation[*].numApps = 0

# Client: London requests video from New York
SatSGP4.groundStation[0].numApps = 2
SatSGP4.groundStation[0].app[0].typename = "UdpVideoStreamClient"
SatSGP4.groundStation[0].app[0].serverAddress = "SatSGP4.groundStation[1]"
SatSGP4.groundStation[0].app[0].serverPort = 1000
SatSGP4.groundStation[0].app[0].localPort = 1001
SatSGP4.groundStation[0].app[0].startTime = 1s

# Server: New York sends video stream to London
SatSGP4.groundStation[1].numApps = 1
SatSGP4.groundStation[1].app[0].typename = "UdpVideoStreamServer"
SatSGP4.groundStation[1].app[0].localPort = 1000

# 1200 bytes every 2 ms ≈ 4.8 Mbps
SatSGP4.groundStation[1].app[0].packetLen = 1200B
SatSGP4.groundStation[1].app[0].sendInterval = 2ms
SatSGP4.groundStation[1].app[0].videoSize = 100MiB

# Focused recording
**.scalar-recording = true

SatSGP4.groundStation[0].app[0].packetReceived:vector.vector-recording = true
SatSGP4.groundStation[0].app[0].throughput:vector.vector-recording = true
SatSGP4.groundStation[0].app[0].endToEndDelay:vector.vector-recording = true
SatSGP4.groundStation[1].app[0].packetSent:vector.vector-recording = true

# RTT probe running alongside the video stream
SatSGP4.groundStation[0].app[1].typename = "PingApp"
SatSGP4.groundStation[0].app[1].destAddr = "SatSGP4.groundStation[1]"
SatSGP4.groundStation[0].app[1].startTime = 1s
SatSGP4.groundStation[0].app[1].sendInterval = 50ms

# Record RTT vector
SatSGP4.groundStation[0].app[1].rtt:vector.vector-recording = true

**.vector-recording = false


[Config TcpSegmentProbe]
extends = Experiment1
description = "Proof-of-concept TCP segment-style downloads between London and New York"

sim-time-limit = 30s

# Keep the same app count shape as the VideoUDP + RTT run:
# app[0] = TCP segment client
# app[1] = Ping RTT probe
SatSGP4.groundStation[0].numApps = 2

# Server host:
# app[0] = generic TCP reply server
SatSGP4.groundStation[1].numApps = 1

# -------------------------------------------------------------------
# TCP client: treats each response as one fixed-size "video segment"
# -------------------------------------------------------------------
SatSGP4.groundStation[0].app[0].typename = "TcpBasicClientApp"
SatSGP4.groundStation[0].app[0].connectAddress = "SatSGP4.groundStation[1]"
SatSGP4.groundStation[0].app[0].connectPort = 1000
SatSGP4.groundStation[0].app[0].localPort = -1
SatSGP4.groundStation[0].app[0].startTime = 1s
SatSGP4.groundStation[0].app[0].stopTime = 29s

# 15 sequential requests in one TCP session
SatSGP4.groundStation[0].app[0].numRequestsPerSession = 15

# Small request, like an HTTP segment request
SatSGP4.groundStation[0].app[0].requestLength = 200B

# 2-second segment at 3 Mbps:
# 3,000,000 bit/s * 2 s / 8 = 750,000 B
SatSGP4.groundStation[0].app[0].replyLength = 750000B

# Wait between completed segment downloads so requests span the run
SatSGP4.groundStation[0].app[0].thinkTime = 1s

# Prevent it from starting another session after finishing the 15 requests
SatSGP4.groundStation[0].app[0].idleInterval = 1000s

# -------------------------------------------------------------------
# TCP generic server: returns payloads of the requested replyLength
# -------------------------------------------------------------------
SatSGP4.groundStation[1].app[0].typename = "TcpGenericServerApp"
SatSGP4.groundStation[1].app[0].localPort = 1000
SatSGP4.groundStation[1].app[0].replyDelay = 0s

# -------------------------------------------------------------------
# RTT probe in parallel, same as your working VideoUDP run
# -------------------------------------------------------------------
SatSGP4.groundStation[0].app[1].typename = "PingApp"
SatSGP4.groundStation[0].app[1].destAddr = "SatSGP4.groundStation[1]"
SatSGP4.groundStation[0].app[1].startTime = 1s
SatSGP4.groundStation[0].app[1].sendInterval = 50ms

# -------------------------------------------------------------------
# Result recording
# -------------------------------------------------------------------
**.scalar-recording = true

SatSGP4.groundStation[0].app[0].packetReceived:vector.vector-recording = true
SatSGP4.groundStation[0].app[0].packetSent:vector.vector-recording = true
SatSGP4.groundStation[0].app[0].endToEndDelay:vector.vector-recording = true
SatSGP4.groundStation[0].app[0].numActiveSessions:vector.vector-recording = true

SatSGP4.groundStation[1].app[0].packetReceived:vector.vector-recording = true
SatSGP4.groundStation[1].app[0].packetSent:vector.vector-recording = true

SatSGP4.groundStation[0].app[1].rtt:vector.vector-recording = true

**.vector-recording = false


